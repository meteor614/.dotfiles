# Self-contained tmux configuration.
# tuios 是日常主力，tmux 只用于远程 SSH / 嵌套场景；用到的设置都写在这里，
# 不依赖子模块或上游基础配置。

# -- terminal & colour --------------------------------------------------------

# 统一 TERM，避免本地/远程会话在滚动、颜色上行为不一致。
set -g default-terminal "screen-256color"

# 重载配置时先清空，避免 terminal-overrides 重复累积。
set -gu terminal-overrides
# iTerm2 Meta + 方向键；256 色终端声明 truecolor。
set -ga terminal-overrides ",xterm-kitty:Tc,*256col*:Tc,*:kUP3=\e[1;9A,*:kDN3=\e[1;9B,*:kRIT3=\e[1;9C,*:kLFT3=\e[1;9D"
# OSC52：screen-256color 没有 Ms 能力，显式补上，让 tmux 的复制能经由
# 外层（tuios/herdr/ghostty）写进系统剪贴板，这也是 SSH 下唯一可靠的路径。
set -ga terminal-overrides ",*:Ms=\\E]52;%p1%s;%p2%s\\007"

# 双向 OSC52：tmux 自己的 yank 发 OSC52，也放行内部程序（nvim 等）的 OSC52。
set -g set-clipboard on
set -g allow-passthrough on

set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY TERM TERM_PROGRAM COLORTERM"
set -s focus-events on
setw -g aggressive-resize on

# Ctrl+Shift 组合键需要，旧版 tmux 不认这个选项。
%if #{>=:#{version},3.2}
set -g extended-keys on
%endif

# -- general ------------------------------------------------------------------

set -sg escape-time 10           # 更快的 Esc 响应（vim 友好）
set -sg repeat-time 600          # 放宽容器的重复按键窗口
set -g history-limit 10000
set -g base-index 1              # window 从 1 开始编号
setw -g pane-base-index 1        # pane 编号与 window 一致
set -g renumber-windows on
setw -g automatic-rename on      # window 名跟随前台程序
set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 30        # 30s 刷新一次状态栏，减少重绘

# activity 只在状态栏高亮，不弹提示、不响铃。
set -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

# prefix：保留默认 C-b，同时把 C-a 作为第二 prefix（GNU Screen 习惯）。
set -g prefix C-b
set -g prefix2 C-a
bind C-a send-prefix -2

# -- status line --------------------------------------------------------------

set -g status-style "fg=#8a8a8a,bg=#080808"
set -g status-left-length 40
set -g status-left " #[fg=#000000,bg=#ffff00,bold] #S #[default]"
set -g status-right-length 120
# 红底段显示当前状态：嵌套开关关闭时 OFF，按下 prefix 时 PREFIX。
set -g status-right "#[fg=#e4e4e4,bg=#d70000,bold]#{?#{==:#{client_key_table},off}, OFF ,#{?client_prefix, PREFIX ,}}#[fg=#8a8a8a,bg=#080808] %H:%M %d-%b | #H "

setw -g window-status-format " #I #W "
setw -g window-status-style "fg=#8a8a8a,bg=#080808"
setw -g window-status-current-format "#[fg=#000000,bg=#00afff,bold] #I #W #[default]"
setw -g window-status-current-style "fg=#000000,bg=#00afff,bold"
setw -g window-status-activity-style "fg=default,bg=default,underscore"
setw -g window-status-bell-style "fg=#ffff00,bg=default,blink,bold"
setw -g window-status-last-style "fg=#00afff"
setw -g window-status-separator ""

set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#00afff"
set -g display-panes-colour "#00afff"
set -g display-panes-active-colour "#00afff"

set -g message-style "fg=#000000,bg=#ffff00,bold"
set -g message-command-style "fg=#ffff00,bg=#000000,bold"
setw -g mode-style "fg=#000000,bg=#ffff00,bold"
setw -g clock-mode-colour "#00afff"
setw -g clock-mode-style 24

# SSH 会话把状态栏放顶部，避免和终端自己的标签栏/状态栏挤在一起。
if-shell 'test -n "$SSH_CONNECTION"' 'set -g status-position top'

# -- keys: session / window / pane --------------------------------------------

bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l
bind Tab last-window

bind - split-window -v           # 上下分屏
bind _ split-window -h           # 左右分屏
bind | split-window -h           # 左右分屏（tuios/zellij 的 '|'）

bind c new-window -c "#{pane_current_path}"   # 新窗口继承当前 pane 目录（tuios 默认）
bind R rotate-window             # 轮换 pane（tuios prefix R rotate_split）
bind K clear-history             # 清掉当前 pane 的 scrollback（tuios prefix K）

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
# K 让给 clear-history；向上调整仍有默认的 prefix M-Up / C-Up。
bind -r L resize-pane -R 2
bind > swap-pane -D
bind < swap-pane -U

bind -r C-h previous-window
bind -r C-l next-window
bind -r C-S-H swap-window -t -1 \; select-window -t -1
bind -r C-S-L swap-window -t +1 \; select-window -t +1

bind b list-buffers
bind p paste-buffer
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# -- keys: mouse / copy mode --------------------------------------------------

set -g mouse on
set -g status-keys vi
setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi WheelUpPane send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N3 -X scroll-down
# 压平换行后复制并退出，贴进 agent 对话框/聊天不乱版式（tuios copy_pipe "p"）。
bind -T copy-mode-vi p send -X copy-pipe-and-cancel "tr '\n' ' '"

# -- keys: 与 zellij / tuios 对齐的免 prefix 键 -------------------------------

# 嵌套 tmux：禁用外层 prefix，让按键直达内层会话；再按一次恢复。
bind -T root C-M-a set prefix None \; set prefix2 None \; set key-table off \; refresh-client -S
bind -T off C-M-a set -u prefix \; set -u prefix2 \; set -u key-table \; refresh-client -S

# Alt+n：新建 pane（水平）
bind -n M-n split-window -h

# Alt+[/]：切换 pane
bind -n M-] select-pane -t +
bind -n M-[ select-pane -t -

# Alt+/：树形选择器（等价 prefix s；tuios 的 choose_tree）
bind -n M-/ choose-tree -Zs

# Alt+1..9：切换 window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Ctrl+Alt+h/j/k/l：按方向切换 pane（tuios terminal_focus_*）
bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R

# Ctrl+Alt+z：最大化/还原当前 pane（tuios snap_fullscreen）
bind -n C-M-z resize-pane -Z

# Ctrl+Alt+t/w/d/D：新建 window、关闭 window、水平/垂直分屏
bind -n C-M-t new-window -c "#{pane_current_path}"
bind -n C-M-w confirm-before -p "kill window #W? (y/n)" kill-window
bind -n C-M-d split-window -h
bind -n C-M-D split-window -v
