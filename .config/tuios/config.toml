# TUIOS Configuration File
#
# This file is deliberately a diff against the defaults, not a copy of them:
# anything it does not mention gets its default back, so deleting a line is how
# you unset it. Keep it that way — never let a tool re-pin the defaults here.
#
# Everything *about* this file — the reload/inode rules, the whole-template
# rewrite trap, and the audit commands — lives in README (## tuios) and
# KEYBINDINGS.md. Keeping it there and not here is deliberate: one source
# cannot drift from itself.
#
# Path: $HOME/.config/tuios/config.toml, a symlink into this dotfiles repo.
# tuios rewrites this path in place from its settings page, `config edit` and
# `keybinds free|unbind`; if that replaces the symlink with a regular file, the
# repo copy goes stale — re-link via `setup.sh` after such edits.
# Upstream: https://github.com/Gaurav-Gosain/tuios

# ============================================================================
# APPEARANCE
# ============================================================================
# theme: color theme name (e.g. dracula, nord); empty for terminal colors
# background: off (your terminal shows through), theme (the theme's
#               background), or #RRGGBB, for every surface at once
# auto_enter_terminal_on_focus: off (Tab keeps cycling windows),
#               targeted (numbered select and arrows start typing),
#               all (every covered focus command, including Tab)
#
# Read-only: `tuios list-themes <id> --json` reports which palette
# entries fail their contrast floor (4.5 for fg, 3.0 for the rest, measured
# against the theme's own background). gruvbox_light fails four of them (black,
# bright_green, bright_yellow, bright_cyan — near-white on a light ground), so
# coloured ls and syntax highlighting lose those variants. gruvbox_dark_hard
# fails one: `black` is #1b1b1b, i.e. the background itself (ratio 1.00), which
# only matters for a program that draws text in colour 0 — that text is
# invisible on any gruvbox dark ground, in this theme and in the original.
[appearance]
theme = 'gruvbox_dark_hard'

# Paint the theme's own background on every tuios surface. Without this the
# panes sit on Ghostty's default ground (#282c34 — `ghostty +show-config
# --default`), while `tuios list-themes <id> --json` measures contrast against
# the theme's own ground #1b1b1b. On #282c34 red falls 3.15 → 2.56 and green
# 5.56 → 4.52, i.e. below their floors; 'theme' makes the audit's premise true.
background = 'theme'

# Quitting the whole session asks first, which matters because a stray ctrl+b q
# otherwise drops every pane and every agent running in them.
confirm_quit = true

# Numbered select and arrow focus put the pane into terminal mode as it focuses,
# so typing lands in the shell instead of parking in window mode. Getting
# alt+left/right back for shell word movement is a separate change — see
# [keybindings.terminal_mode] below.
auto_enter_terminal_on_focus = 'targeted'

show_clock = true

right_click_opens_menu = true

whichkey_position = 'center'

[appearance.sidebar]
position = 'left'
# Spacer rows keep the sections readable; files:70 gives the file tree most of
# the column so deep paths stop truncating.
sections = 'sessions,spacer:4,terminals,spacer:4,files:70,spacer:4,agents'

# ============================================================================
# KEYBINDINGS
# ============================================================================
# Set an action to [] to unbind it and hand the key back to the shell.
# An empty list and a missing line are not the same thing.
#
# Edit this file by hand. The in-app key manager (leader then k, or the command
# palette) and the shell forms below rewrite config.toml as a whole re-pinned
# template, dropping this diff — verified for `keybinds unbind` in a throwaway
# XDG_CONFIG_HOME, see README (## tuios). Use them as diagnostics, not writers.
#
#   tuios keybinds unbind close_window w   # rewrites the whole file
#   tuios keybinds free alt+left           # rewrites the whole file
#
# `tuios keybinds doctor` says which binding in each scope is live, what
# clashes with what, and which keys never reach the program in the pane.
# `tuios keybinds list-custom` lists only the actions whose default key was
# replaced — a key added on top of a default (alt+f, ctrl+alt+t/alt+n,
# ctrl+alt+z) does not show up there. `keybinds doctor` and
# `keybinds explain <key>` read the file and do.
#
# The leader itself is not configurable: ctrl+b starts a prefix command in the
# built-in layer (`tuios keybinds explain ctrl+b`), so there is nothing to pin
# here and `keybindings.leader_key` would only be noise.
[keybindings]

# ctrl+p and alt+space belong to the shell: ctrl+p is zsh's up-line-or-history,
# alt+space its expand-history. The palette and the launcher stay reachable from
# the prefix (leader then P, leader then a).
#
# alt+f is the floating-pane key in herdr and zellij. tuios has no floating
# pane, so it borrows the key for the scratch terminal, which is otherwise only
# reachable after the leader (ctrl+b g — prefix_mode is untouched, both work).
# The cost is zsh's default `^[f` forward-word; alt+right jumps words here
# anyway. new_window keeps the cross-multiplexer Ctrl+Alt+t (see
# KEYBINDINGS.md) plus alt+n. snap_fullscreen adds the key herdr calls zoom
# (ctrl+alt+z) on top of the layout-scope f; all of these are scope global, so
# they fire in window mode and terminal mode alike. `keybinds list-custom` does
# not count bindings added this way — it only lists actions whose default key
# was replaced; `keybinds doctor` and `keybinds explain <key>` do show them.
[keybindings.global]
command_palette = []
launcher = []
toggle_scratch = ['alt+f']
new_window = ['ctrl+alt+t', 'alt+n']
snap_fullscreen = ['ctrl+alt+z']

# Bare arrows belong to the shell (history, line editing) and .zshrc.local binds
# alt+left/right to word jumps plus alt+up/down to line start/end, so pane focus
# uses ctrl+alt+{h,j,k,l} only — matching herdr and leaving every alt+arrow to
# the shell (`tuios keybinds explain alt+up` reads "free"). zellij is aligned now:
# .config/zellij/config.kdl releases all four Alt+arrows too, leaving Ctrl+Alt
# as the only pane-focus layer in both multiplexers.
# Window cycling takes alt+[ / alt+] alongside opt+tab — both are unbound in zsh
# — which frees the default alt+p for its history-search-backward. alt+n is not:
# [keybindings.global] uses it, with ctrl+alt+t, to open a window.
[keybindings.terminal_mode]
terminal_focus_left = ['ctrl+alt+h']
terminal_focus_right = ['ctrl+alt+l']
terminal_focus_up = ['ctrl+alt+k']
terminal_focus_down = ['ctrl+alt+j']
terminal_next_window = ['opt+tab', 'alt+]']
terminal_prev_window = ['opt+shift+tab', 'alt+[']

# ============================================================================
# STARTUP
# ============================================================================
# A fresh daemon opens one window instead of an empty desktop, starts in
# terminal mode so the pane takes typing at once, and does not tile it —
# splits are placed by hand.
[startup]
open_default_window = true
start_in_terminal_mode = true
tiled = false
daemon = true

# ============================================================================
# DAEMON
# ============================================================================
# Each pane keeps appearance.scrollback_lines (10000) lines in memory, but the
# daemon's saved history defaults to only 1000 lines / 2048 KiB per pane, so a
# daemon restart silently truncates a long agent log. Raise the line cap toward
# the in-memory buffer; a change applies when the daemon next starts.
[daemon]
persist_scrollback_lines = 5000
